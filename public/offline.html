<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3D4A2A">
<title>Sem conexão · HOLY CAMP</title>
<style>
  html,body{margin:0;height:100%}
  body{display:flex;align-items:center;justify-content:center;background:#252E1A url(/textura-topografica.svg) center/cover;
    font-family:system-ui,-apple-system,sans-serif;color:#fff;text-align:center;padding:24px;box-sizing:border-box}
  .card{max-width:320px}
  img{width:96px;height:96px;border-radius:20px}
  h1{font-size:22px;margin:20px 0 8px}
  p{color:#DDE3CF;font-size:15px;line-height:1.5;margin:0 0 22px}
  button{background:#C8A165;color:#1F2716;border:0;border-radius:8px;font-weight:700;font-size:16px;height:48px;padding:0 24px}
</style>
</head>
<body>
  <div class="card">
    <img src="/app/icon-192.png" alt="HOLY CAMP">
    <h1>Sem conexão com a internet</h1>
    <p>O HOLY CAMP precisa de internet para mostrar os dados atualizados. Confira o Wi-Fi ou os dados móveis.</p>
    <button onclick="location.reload()">Tentar de novo</button>
  </div>
</body>
</html>
